<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  body { margin:0; }
</style>
</helmet>

<div style="font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;box-sizing:border-box;width:max-content;min-width:100%;min-height:100vh;padding:56px 64px;background:#E7E5DF;">

  <div style="max-width:1320px;margin-bottom:38px;">
    <div style="font-size:13px;font-weight:700;letter-spacing:0.08em;color:#8C8A82;text-transform:uppercase;margin-bottom:10px;">Visual Direction Study · Android</div>
    <div style="font-size:34px;font-weight:800;letter-spacing:-0.02em;color:#1A1A17;line-height:1.15;">냉장고 지킴이 — 비주얼 방향 3가지</div>
    <div style="margin-top:12px;font-size:15px;line-height:1.6;color:#5C5A53;max-width:760px;">유통기한 관리 앱의 같은 구조, 다른 감각. 세 폰 모두 실제로 탭하며 둘러볼 수 있어요 — 카드를 눌러 상세로, <b style="color:#1A1A17;">+ 식품 추가</b>로 입력·스캔, 종 아이콘으로 알림, <b style="color:#1A1A17;">실온</b> 필터로 빈 상태까지.</div>
  </div>

  <div style="display:flex;gap:56px;align-items:flex-start;">

    <div style="flex:none;width:392px;">
      <div style="margin-bottom:16px;">
        <div style="font-size:18px;font-weight:800;color:#1A1A17;">Fresh</div>
        <div style="font-size:13.5px;color:#6B6A62;margin-top:3px;">산뜻한 데이라이트 · 화이트 카드 · 가든 그린</div>
      </div>
      <dc-import name="Phone" variant="fresh" hint-size="392px,812px" style="width:392px"></dc-import>
    </div>

    <div style="flex:none;width:392px;">
      <div style="margin-bottom:16px;">
        <div style="font-size:18px;font-weight:800;color:#1A1A17;">Midnight</div>
        <div style="font-size:13.5px;color:#6B6A62;margin-top:3px;">프리미엄 다크 · 라임 네온 포인트 · 자주 보고 싶은</div>
      </div>
      <dc-import name="Phone" variant="midnight" hint-size="392px,812px" style="width:392px"></dc-import>
    </div>

    <div style="flex:none;width:392px;">
      <div style="margin-bottom:16px;">
        <div style="font-size:18px;font-weight:800;color:#1A1A17;">Pop</div>
        <div style="font-size:13.5px;color:#6B6A62;margin-top:3px;">감각적인 팝 · 두꺼운 보더 · 스티커 배지</div>
      </div>
      <dc-import name="Phone" variant="pop" hint-size="392px,812px" style="width:392px"></dc-import>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
